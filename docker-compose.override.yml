# ── Development override ─────────────────────────────────────
# Использование:
#   docker compose --profile cpu up --build      (первый запуск / после новых зависимостей
#                                                  ИЛИ после правок React — фронтенд
#                                                  собирается ВНУТРИ образа, npm на хосте
#                                                  не нужен)
#   docker compose --profile cpu up              (bind-mounts подтягивают изменения кода)
#
# После изменений в Python → достаточно перезапустить контейнер (без --build):
#   docker compose --profile cpu restart app-cpu
#
# frontend/dist НЕ бинд-маунтится специально: он собирается в Stage 1
# Dockerfile'а (node:20-alpine, npm ci && npm run build) и копируется в образ.
# Бинд-маунт поверх него скрыл бы собранный фронтенд пустой хостовой папкой
# при первом запуске (frontend/dist в .gitignore, на хосте её ещё нет) —
# оставляем сборку целиком на Docker, чтобы `up --build` сам делал всё.

x-dev-mounts: &dev-mounts
  volumes:
    - ./backend:/app/backend
    - ./app.py:/app/app.py
    - ./config.py:/app/config.py
    - ./main.py:/app/main.py
    - ./state.py:/app/state.py
    - ./camera.py:/app/camera.py
    - ./detection.py:/app/detection.py
    - ./gestures.py:/app/gestures.py
    - ./visualization.py:/app/visualization.py
    - ./reid.py:/app/reid.py
    - ./migrations:/app/migrations
    - ./tests:/app/tests
  environment:
    - FLASK_DEBUG=1
    - PYTHONDONTWRITEBYTECODE=1

services:
  app-cpu:
    <<: *dev-mounts
    command: >
      sh -c "
        pip install -q boto3 paho-mqtt pytest pytest-cov 2>/dev/null &&
        python3 -m pytest tests/ -v --tb=short &&
        python3 -u app.py
      "

  app-gpu:
    <<: *dev-mounts
    command: >
      sh -c "
        pip install -q boto3 paho-mqtt pytest pytest-cov 2>/dev/null &&
        python3 -m pytest tests/ -v --tb=short &&
        python3 -u app.py
      "
