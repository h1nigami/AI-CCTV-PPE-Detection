# Запуск фронта на ОТДЕЛЬНОМ сервере (nginx раздаёт статику + reverse-proxy на бэк).
# Адрес бэка (BACKEND_URL) берётся из deploy.env — единого конфига деплоя.

version: '3'

services:
  frontend-web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: kontroler-frontend
    ports:
      - "80:80"
    env_file:
      - deploy.env
    restart: unless-stopped
