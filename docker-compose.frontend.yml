# Запуск фронта на ОТДЕЛЬНОМ сервере (nginx раздаёт статику + reverse-proxy на бэк).
# Адрес бэка меняется через BACKEND_URL (без пересборки кода — только пересоздать контейнер).

version: '3'

services:
  frontend-web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: kontroler-frontend
    ports:
      - "80:80"
    environment:
      - BACKEND_URL=http://192.168.0.97:8000
    restart: unless-stopped
