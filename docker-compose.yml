x-common: &common
  build:
    context: .
  ports:
    - "8000:8000"
  volumes:
    - ./models:/app/models
    - ./data:/app/data
    - ./uploads:/app/uploads
    - ./violation_logs:/app/violation_logs
  restart: unless-stopped
  environment:
    - TZ=Europe/Moscow

services:

  # ─────────────────────────────────────────────────
  #  CPU profile (default)
  # ─────────────────────────────────────────────────
  app-cpu:
    <<: *common
    profiles: ["cpu", ""]
    build:
      dockerfile: Dockerfile
    container_name: kontroler-cpu
    depends_on:
      createbuckets:
        condition: service_completed_successfully

  # ─────────────────────────────────────────────────
  #  GPU profile (NVIDIA CUDA)
  # ─────────────────────────────────────────────────
  app-gpu:
    <<: *common
    profiles: ["gpu"]
    build:
      dockerfile: Dockerfile.gpu
    container_name: kontroler-gpu
    depends_on:
      createbuckets:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - TZ=Europe/Moscow
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

  # ─────────────────────────────────────────────────
  #  MQTT broker (для будущей Frigate-архитектуры)
  # ─────────────────────────────────────────────────
  mqtt:
    image: eclipse-mosquitto:2
    profiles: ["cpu", "gpu"]
    container_name: kontroler-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

  # ─────────────────────────────────────────────────
  #  MinIO (S3-совместимое хранилище для клипов событий)
  # ─────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    profiles: ["cpu", "gpu"]
    container_name: kontroler-minio
    command: server /data --console-address ":9002"
    ports:
      - "9000:9000"
      - "9002:9002"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    restart: unless-stopped

  # Создание bucket'ов при старте MinIO
  createbuckets:
    image: minio/mc:latest
    profiles: ["cpu", "gpu"]
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/events --ignore-existing;
      /usr/bin/mc policy set public myminio/events;
      echo 'MinIO buckets ready';
      exit 0;
      "

volumes:
  mosquitto_data:
  mosquitto_log:
  minio_data:
