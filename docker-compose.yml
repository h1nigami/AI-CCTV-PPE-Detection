x-common: &common
  build:
    context: .
  ports:
    - "8000:8000"
  volumes:
    - ./models:/app/models
    - ./data:/app/data
    - ./uploads:/app/uploads
    - ./violation_logs:/app/violation_logs
  restart: unless-stopped
  environment:
    - TZ=Europe/Moscow
    # Подсеть(и) для скана камер кнопкой «Найти камеры». В bridge-сети local_ip()
    # видит docker-подсеть, а не LAN — поэтому указываем реальную подсеть с
    # камерами явно (через запятую можно несколько: 192.168.0,192.168.1).
    # Подсети уже добавленных сетевых камер подхватываются автоматически.
    - DISCOVERY_SUBNET=192.168.0
    # Для ONVIF-multicast дополнительно нужен network_mode: host (несовместим с ports).
    # Мягкий порог уверенности для детекции СИЗ (каска/маска/жилет): люди/конусы
    # остаются на CONF_THRESH=0.75. Ниже → охотнее ловится каска (меньше ложных
    # «нет каски»), но растёт риск ложного «СИЗ есть».
    - PPE_CONF_THRESH=0.35
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status==200 else 1)"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 60s

# Kiosk-контейнер: Chromium, рисующий окно на X11-дисплее ХОСТА (не headless).
# Только Linux-хост с физическим монитором и залогиненной X-сессией (обычная
# рабочая станция/диспетчерская). ОДИН РАЗ перед первым запуском на хосте:
#   xhost +local:docker
# (разрешает локальным Docker-контейнерам подключаться к X-серверу; без этого
# Chromium упадёт с "cannot open display"). Дальше просто
# `docker compose --profile gpu up --build` поднимает бэкенд и киоск вместе.
# На Windows этот подход НЕ работает (см. git-историю: пробовали через WSLg,
# отказались из-за нестабильности) — там нужен нативный Chrome, см.
# docs/kiosk-mode.md (kiosk/start_kiosk.ps1).
x-kiosk-common: &kiosk-common
  build:
    context: ./kiosk
    dockerfile: Dockerfile
  restart: unless-stopped
  environment:
    - DISPLAY=${DISPLAY:-:0}
    - XAUTHORITY=/root/.Xauthority
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - ${XAUTHORITY:-${HOME}/.Xauthority}:/root/.Xauthority:ro

services:

  # ─────────────────────────────────────────────────
  #  CPU profile (default)
  # ─────────────────────────────────────────────────
  app-cpu:
    <<: *common
    profiles: ["cpu", ""]
    build:
      dockerfile: Dockerfile
    container_name: kontroler-cpu
    depends_on:
      createbuckets:
        condition: service_completed_successfully

  # Kiosk для CPU-профиля: полноэкранный Chromium на дисплее хоста,
  # открывается автоматически вместе с бэкендом.
  kiosk-cpu:
    <<: *kiosk-common
    profiles: ["cpu"]
    container_name: kontroler-kiosk-cpu
    depends_on:
      app-cpu:
        condition: service_healthy
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - XAUTHORITY=/root/.Xauthority
      - KIOSK_URL=http://app-cpu:8000
    volumes:
      # volumes: (как и environment:) перекрывает x-kiosk-common целиком —
      # дублируем X11-маунты явно, иначе Chromium не найдёт дисплей.
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-${HOME}/.Xauthority}:/root/.Xauthority:ro
      - kiosk_profile_cpu:/data/chromium-profile

  # ─────────────────────────────────────────────────
  #  GPU profile (NVIDIA CUDA)
  # ─────────────────────────────────────────────────
  app-gpu:
    <<: *common
    profiles: ["gpu"]
    build:
      dockerfile: Dockerfile.gpu
    container_name: kontroler-gpu
    depends_on:
      createbuckets:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - TZ=Europe/Moscow
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # У app-gpu свой блок environment — он перекрывает x-common (YAML merge-key
      # не делает deep-merge), поэтому переменные из x-common дублируем здесь явно.
      - DISCOVERY_SUBNET=192.168.0
      - PPE_CONF_THRESH=0.35

  # Kiosk для GPU-профиля: полноэкранный Chromium на дисплее хоста,
  # открывается автоматически вместе с бэкендом (см. заголовок
  # x-kiosk-common выше про требование `xhost +local:docker` на хосте).
  kiosk-gpu:
    <<: *kiosk-common
    profiles: ["gpu"]
    container_name: kontroler-kiosk-gpu
    depends_on:
      app-gpu:
        condition: service_healthy
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - XAUTHORITY=/root/.Xauthority
      - KIOSK_URL=http://app-gpu:8000
    volumes:
      # volumes: (как и environment:) перекрывает x-kiosk-common целиком —
      # дублируем X11-маунты явно, иначе Chromium не найдёт дисплей.
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-${HOME}/.Xauthority}:/root/.Xauthority:ro
      - kiosk_profile_gpu:/data/chromium-profile

  # ─────────────────────────────────────────────────
  #  MQTT broker (для будущей Frigate-архитектуры)
  # ─────────────────────────────────────────────────
  mqtt:
    image: eclipse-mosquitto:2
    profiles: ["cpu", "gpu"]
    container_name: kontroler-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

  # ─────────────────────────────────────────────────
  #  MinIO (S3-совместимое хранилище для клипов событий)
  # ─────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    profiles: ["cpu", "gpu"]
    container_name: kontroler-minio
    command: server /data --console-address ":9002"
    ports:
      - "9000:9000"
      - "9002:9002"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    restart: unless-stopped

  # Создание bucket'ов при старте MinIO
  createbuckets:
    image: minio/mc:latest
    profiles: ["cpu", "gpu"]
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/events --ignore-existing;
      /usr/bin/mc policy set public myminio/events;
      echo 'MinIO buckets ready';
      exit 0;
      "

volumes:
  mosquitto_data:
  mosquitto_log:
  minio_data:
  kiosk_profile_cpu:
  kiosk_profile_gpu:
